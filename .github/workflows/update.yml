name: Payload Aggregation

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 45))
          echo "Sleeping ${DELAY}m before starting..."
          sleep $((DELAY * 60))

      - name: Run aggregation pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/collect.sh
          ./scripts/collect.sh

      - name: Commit if changed
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name 'pred07'
            git config user.email 'pred07@users.noreply.github.com'
            git add -A
            MSGS=("syncing latest payloads" "updated datasets" "adding new findings" "database maintenance" "refreshed sources" "synced with upstream")
            git commit -m "${MSGS[$RANDOM % ${#MSGS[@]}]}"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected."
          fi
