name: Automated Payload Aggregation

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Random Execution Delay
        run: |
          DELAY=$((RANDOM % 45))
          echo "[*] Sleeping for $DELAY minutes to avoid automation patterns..."
          sleep $((DELAY * 60))

      - name: Run collection pipeline
        run: |
          chmod +x scripts/collect.sh
          ./scripts/collect.sh

      - name: Commit and Push if changed
        run: |
          if [[ -n $(git status --porcelain data/) ]]; then
            # Using main user identity for casual appearance
            git config --global user.name 'pred07'
            git config --global user.email 'pred07@users.noreply.github.com'
            git add data/
            
            # Selection of human-like casual commit messages
            MESSAGES=("syncing latest payloads" "updated datasets" "adding new findings" "database maintenance" "refreshed sources" "synced with upstream")
            RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
            
            git commit -m "$RANDOM_MSG"
            git push origin main
          else
            echo "[*] No data changes detected. No commit necessary."
          fi
