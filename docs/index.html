<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPLOITDECK | Curated Payload Database</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal-header">root@exploitdeck:~#</div>
    <a class="github-link" href="https://github.com/pred07/PAYLOAD-DP" target="_blank" title="View on GitHub">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
    </a>

    <div class="container">
        <header>
            <div class="logo-container">
                <div class="skull-hex">
                    <svg width="60" height="68" viewBox="0 0 60 68"><polygon points="30,2 58,17 58,51 30,66 2,51 2,17" fill="none" stroke="#ff3e3e" stroke-width="2"/><text x="30" y="42" text-anchor="middle" font-size="28" fill="#ff3e3e">💀</text></svg>
                </div>
                <div class="logo-text">
                    <span class="main-title">EXPLOIT<span class="red">DECK</span></span>
                    <span class="sub-title">CURATED PAYLOAD DATABASE</span>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <div class="stat-info">
                    <span class="stat-label">PAYLOADS</span>
                    <span id="total-count" class="stat-value">---</span>
                </div>
            </div>
            <div class="stat-card">
                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <div class="stat-info">
                    <span class="stat-label">LAST UPDATED</span>
                    <span id="last-updated" class="stat-value">---</span>
                </div>
            </div>
        </div>

        <div class="tabs-section">
            <div class="tabs" id="category-tabs">
                <button class="tab-btn active" data-file="sqli.txt">SQLi</button>
                <button class="tab-btn" data-file="xss.txt">XSS</button>
                <button class="tab-btn" data-file="ssrf.txt">SSRF</button>
                <button class="tab-btn" data-file="lfi.txt">LFI</button>
                <button class="tab-btn" data-file="ssti.txt">SSTI</button>
                <button class="tab-btn" data-file="rce.txt">RCE</button>
                <button class="tab-btn" data-file="xxe.txt">XXE</button>
                <button class="tab-btn" data-file="redirect.txt">Redirect</button>
                <button class="tab-btn" data-file="nosql.txt">NoSQL</button>
                <button class="tab-btn" data-file="ldap.txt">LDAP</button>
                <button class="tab-btn" data-file="headers.txt">Headers</button>
                <button class="tab-btn" data-file="jwt.txt">JWT</button>
                <button class="tab-btn" data-file="crlf.txt">CRLF</button>
                <button class="tab-btn" data-file="graphql.txt">GraphQL</button>
                <button class="tab-btn" data-file="cors.txt">CORS</button>
                <button class="tab-btn" data-file="deserial.txt">Deserial</button>
                <button class="tab-btn" data-file="pollution.txt">Pollution</button>
                <button class="tab-btn" data-file="cloud.txt">Cloud</button>
                <button class="tab-btn" data-file="wordpress.txt">WordPress</button>
                <button class="tab-btn" data-file="encoding.txt">Encoding</button>
            </div>
            <div class="search-wrapper">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="search-input" placeholder="Search payloads...">
            </div>
        </div>

        <div class="payload-box">
            <div id="payload-count-bar" class="count-bar">Loading...</div>
            <div id="payload-list" class="payload-list"></div>
        </div>

        <footer>
            <div class="footer-version">v2.0.0</div>
            <div class="footer-tagline"><span class="red">EXPLOITDECK</span> // OFFENSIVE PAYLOADS. REAL-WORLD IMPACT.</div>
            <div class="terminal-cursor">&gt;_</div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
